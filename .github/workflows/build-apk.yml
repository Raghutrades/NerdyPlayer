name: Build NerdyPlayer APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the project (unzip if needed) and add your photo
        run: |
          if [ -f settings.gradle ]; then
            ROOT=.
          else
            mkdir -p _unz
            Z=NerdyPlayer-source.zip
            [ -f "$Z" ] || Z=$(ls *.zip | head -1)
            echo "Using $Z"
            unzip -q -o "$Z" -d _unz
            ROOT=$(dirname "$(find _unz -name settings.gradle | head -1)")
          fi
          echo "Project root: $ROOT"
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          WWW="$ROOT/app/src/main/assets/www"
          for f in raghu.jpg raghu.jpeg raghu.png raghu.webp; do [ -f "$f" ] && cp "$f" "$WWW/" && echo "Added photo $f" || true; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses (SDK is preinstalled on the runner)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "sdk.dir=$SDK" > "$ROOT/local.properties"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: cd "$ROOT" && gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" out/NerdyPlayer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NerdyPlayer-apk
          path: out/NerdyPlayer.apk

      - name: Publish to Releases (easy download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NerdyPlayer (latest build)
          body: NerdyPlayer 3.0 - VLC-powered player. Download NerdyPlayer.apk below and install it over the old one. Each push rebuilds this file.
          files: out/NerdyPlayer.apk
          make_latest: true
